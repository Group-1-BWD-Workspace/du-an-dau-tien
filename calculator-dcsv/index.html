<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Máy tính cầm tay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator" aria-label="Máy tính cầm tay">
    <form id="calc-form">
      <section class="screen" aria-label="Màn hình hiển thị">
        <label for="display" class="sr-only">Kết quả</label>
        <input type="text" id="display" readonly value="0">
      </section>

      <section class="keypad" aria-label="Bàn phím máy tính">
        <button type="button" class="btn btn-action" onclick="clearDisplay()">C</button>
        <button type="button" class="btn btn-action" onclick="deleteLast()">DEL</button>
        <button type="button" class="btn btn-action" onclick="appendValue('%')">%</button>
        <button type="button" class="btn btn-operator" onclick="appendValue('/')">÷</button>

        <button type="button" class="btn btn-num" onclick="appendValue('7')">7</button>
        <button type="button" class="btn btn-num" onclick="appendValue('8')">8</button>
        <button type="button" class="btn btn-num" onclick="appendValue('9')">9</button>
        <button type="button" class="btn btn-operator" onclick="appendValue('*')">×</button>

        <button type="button" class="btn btn-num" onclick="appendValue('4')">4</button>
        <button type="button" class="btn btn-num" onclick="appendValue('5')">5</button>
        <button type="button" class="btn btn-num" onclick="appendValue('6')">6</button>
        <button type="button" class="btn btn-operator" onclick="appendValue('-')">−</button>

        <button type="button" class="btn btn-num" onclick="appendValue('1')">1</button>
        <button type="button" class="btn btn-num" onclick="appendValue('2')">2</button>
        <button type="button" class="btn btn-num" onclick="appendValue('3')">3</button>
        <button type="button" class="btn btn-operator" onclick="appendValue('+')">+</button>

        <button type="button" class="btn btn-num btn-zero" onclick="appendValue('0')">0</button>
        <button type="button" class="btn btn-num" onclick="appendValue('.')">.</button>
        <button type="button" class="btn btn-equal" onclick="calculate()">=</button>
      </section>
    </form>
  </main>

  <script src="script.js"></script>

  <button id="view-toggle" type="button" onclick="toggleCalculatorView()" style="position: fixed; top: 12px; left: 12px; z-index: 1000; padding: 8px 12px; cursor: pointer;">Chuyển sang bản thuần</button>

  <main id="simple-calculator" aria-label="Máy tính bản HTML thuần" style="padding-top: 56px;" hidden>
    <h1>Máy tính đơn giản</h1>
    <form id="simple-calc-form" onsubmit="simpleCalculate(); return false;">
      <label for="simple-first-number">Số thứ nhất:</label>
      <input id="simple-first-number" type="text" inputmode="decimal" required>
      <br><br>
      <label for="simple-operator">Phép tính:</label>
      <select id="simple-operator">
        <option value="+">Cộng</option>
        <option value="-">Trừ</option>
        <option value="*">Nhân</option>
        <option value="/">Chia</option>
      </select>
      <br><br>
      <label for="simple-second-number">Số thứ hai:</label>
      <input id="simple-second-number" type="text" inputmode="decimal" required>
      <br><br>
      <button type="submit">Tính kết quả</button>
      <button type="button" onclick="simpleClearDisplay()">Nhập lại</button>
    </form>
    <h1>Kết quả</h1>
    <output id="simple-result" aria-live="polite"></output>
  </main>
</body>
</html>
